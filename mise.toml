[tools]
"aqua:tailwindlabs/tailwindcss" = "4.3.3"
ruby = "4.0.9"
typst = "0.13.1"

[tasks.resume]
sources = ["_data/resume.yml", "resume/_resume2023.typ"]
outputs = ["resume.pdf"]
run = "typst compile --root=./ --font-path=assets/fonts/ resume/_resume2023.typ resume.pdf"

[tasks.tailwind]
run = [
  "tailwindcss -i ./_frontend/bashby.css -o ./assets/bashby.css",
  "tailwindcss -i ./_frontend/gallery.css -o ./assets/gallery.css",
]

[tasks.build]
depends = ["resume", "tailwind"]
run = "bundle exec jekyll build --baseurl {{ JEKYLL_BASE_URL | default(value=\"/\") }}"

